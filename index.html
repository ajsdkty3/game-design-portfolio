<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erfei Zhou | Game Design Portfolio</title>
    <meta
      name="description"
      content="Generalist game design portfolio by Erfei Zhou for master's applications."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.v2.css" />
  </head>
  <body>
    <main class="portfolio-shell">
      <button class="nav-arrow nav-arrow-left" type="button" id="prev-slide" aria-label="Previous slide">
        &#10094;
      </button>

      <section class="slide-stage">
        <div class="slides-track" id="slides-track"></div>
      </section>

      <button class="nav-arrow nav-arrow-right" type="button" id="next-slide" aria-label="Next slide">
        &#10095;
      </button>

      <nav class="slide-selector" id="slide-selector" aria-label="Slide selector"></nav>
    </main>

    <div class="modal hidden" id="project-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" type="button" id="modal-close-button" aria-label="Close">
          Close
        </button>
        <div id="modal-content"></div>
      </div>
    </div>

    <script src="script.v2.js"></script>
  </body>
</html>
